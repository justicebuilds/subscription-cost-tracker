<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Tracker</title>

</head>

<body>
  <header>
    <h1>Subscription Tracker</h1>
  </header>

  <main>

    <section>
      <h2>Subscriptions</h2>

      <div id="subscription-list"></div>
    </section>

    <section>
      <h2>Add a Subscription</h2>

      <form id="subscription-form">

        <p>
          <label for="subscription-name">Subscription Name:</label>
          <input type="text" id="subscription-name" required>
        </p>

        <p>
          <label for="subscription-cost">Monthly Cost:</label>
          <input type="number" id="subscription-cost"
                 min="0.01" step="0.01" required>
        </p>

        <button type="submit">Add Subscription</button>

      </form>
    </section>

    <section>
      <details>
        <summary>Show Monthly and Yearly Totals</summary>

        <p id="monthly-total"></p>
        <p id="yearly-total"></p>

      </details>
    </section>

  </main>

  <script src="./script.js"></script>
</body>
</html>
